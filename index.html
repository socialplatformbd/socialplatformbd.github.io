}

async function popularFeed() {
  const m = $("#main");
  const ld = el("div", {class: "center"}, tx("লোড হচ্ছে..."));
  m.append(el("div", {class: "meta"}, tx("সাম্প্রতিক ৩০টি পোস্টের মধ্যে সবচেয়ে বেশি রিঅ্যাকশন ও কমেন্ট পাওয়া পোস্ট")), ld);
  try {
    if (!popCache || Date.now() - popCache.t > 300000) {
      const snap = await getDocs(query(collection(db, "posts"), where("status", "==", "approved"), orderBy("createdAt", "desc"), limit(30)));
      const items = await Promise.all(snap.docs.map(async d => {
        const [lc, cc] = await Promise.all([
          getCountFromServer(collection(db, "posts", d.id, "likes")),
          getCountFromServer(collection(db, "posts", d.id, "comments"))
        ]);
        return {p: {id: d.id, ...d.data()}, score: lc.data().count + cc.data().count * 2};
      }));
      items.sort((a, b) => b.score - a.score || ((b.p.createdAt?.seconds || 0) - (a.p.createdAt?.seconds || 0)));
      popCache = {t: Date.now(), items: items.slice(0, 10)};
    }
    ld.remove();
    const top = popCache.items.filter(x => x.score > 0);
    if (!top.length) m.append(el("div", {class: "center"}, tx("এখনো কোনো জনপ্রিয় পোস্ট নেই।")));

function postCard(p, staffMode, showStatus, autoOpen) {
  const c = el("div", {class: "card"});
  const when = p.createdAt ? new Date(p.createdAt.seconds * 1000).toLocaleString(loc()) : "";
  const meta = el("div", {class: "meta"}, p.uid ? el("a", {href: "#user=" + p.uid}, p.authorName || tx("অজ্ঞাত")) : (p.authorName || tx("অজ্ঞাত")), " · ", p.status === "approved" ? el("a", {href: "#post=" + p.id}, when || tx("লিংক")) : when, " ");
  if (showStatus) meta.append(el("span", {class: "badge " + p.status}, {pending: tx("অপেক্ষমাণ"), approved: tx("অনুমোদিত"), rejected: tx("বাতিল")}[p.status] || p.status));
  c.append(meta);
  if (p.text) c.append(el("div", {style: "white-space:pre-wrap"}, p.text));
  if (p.mediaUrl && /^https:\/\/res\.cloudinary\.com\//.test(p.mediaUrl)) {
    c.append(p.mediaType === "video"
      ? el("video", {src: p.mediaUrl, controls: true, preload: "none", poster: optPoster(p.mediaUrl)})
      : el("img", {src: optImg(p.mediaUrl), loading: "lazy", style: "cursor:zoom-in", onclick: () => window.open(p.mediaUrl, "_blank"),
          onerror: e => { if (e.target.src !== p.mediaUrl) e.target.src = p.mediaUrl; }}));
  }
  if (p.status === "approved") engagement(p, c, autoOpen);
  const row = el("div", {class: "row"});
  if (staffMode) {
    row.append(el("button", {class: "ok", onclick: () => setStatus(p, "approved")}, "Approve"));
    row.append(el("button", {class: "no", onclick: () => setStatus(p, "rejected")}, "Reject"));
    row.append(el("button", {class: "sec", onclick: () => banUser(p.uid, p.authorName)}, tx("ইউজার ব্যান")));
  }
  if (user && p.status === "approved" && p.uid !== user.uid) {
    row.append(el("button", {class: "sec", onclick: () => report("post", p.id, p.id, p.uid, p.authorName, p.text || p.mediaType || tx("মিডিয়া"))}, tx("⚠️ রিপোর্ট")));
  }
  if (staffMode || p.uid === user?.uid) {
    row.append(el("button", {class: "sec", onclick: async () => {
      if (!confirm(tx("মুছে ফেলবেন?"))) return;
      await deleteDoc(doc(db, "posts", p.id)); show(tab);
    }}, tx("মুছুন")));
  }
  if (row.children.length) c.append(row);
  return c;
}

const EMO = {love: "❤️", haha: "😂", wow: "😮", sad: "😢"};

function engagement(p, c, autoOpen) {
  const likeBtn = el("button", {class: "sec"}, "🤍 0");
  const cBtn = el("button", {class: "sec"}, tx("💬 কমেন্ট"));
  const shBtn = el("button", {class: "sec", onclick: () => sharePost(p)}, tx("↗ শেয়ার"));
  const picker = el("div", {class: "row hide"});
  const box = el("div", {class: "hide"});
  c.append(el("div", {class: "row"}, likeBtn, cBtn, shBtn), picker, box);
  const likeRef = user ? doc(db, "posts", p.id, "likes", user.uid) : null;
  let mine = null, count = 0, open = false;
  const paint = () => { likeBtn.textContent = (mine ? EMO[mine] || EMO.love : "🤍") + " " + count; };
  (async () => {
    try {
      const cs = await getCountFromServer(collection(db, "posts", p.id, "likes"));
      count = cs.data().count;
      if (likeRef) {
        const ms = await getDoc(likeRef);
        mine = ms.exists() ? (ms.data().type || "love") : null;
      }
      paint();
    } catch (e) { console.error(e); }
  })();
  const setReaction = async t => {
    picker.className = "row hide";
    const why = blockReason();
    if (t !== null && why) return alert(why);
    try {
      if (t === null) { await deleteDoc(likeRef); if (mine) { count--; mine = null; } }
      else {
        const first = !mine;
        await setDoc(likeRef, {uid: user.uid, type: t});
        track("reaction", {type: t});
        if (first) {
          count++;
          if (p.uid && p.uid !== user.uid) notify({id: "like_" + p.id + "_" + user.uid, to: p.uid, type: "like", postId: p.id, text: EMO[t]});
        }
        mine = t;
      }
      paint();
    } catch (e) { alert(tx("সমস্যা: ") + e.message); }
  };
  Object.keys(EMO).forEach(k => picker.append(el("button", {class: "sec", onclick: () => setReaction(k)}, EMO[k])));
  picker.append(el("button", {class: "sec", onclick: () => setReaction(null)}, tx("✖ সরান")));
  likeBtn.onclick = () => {
    if (!user) return alert(tx("রিঅ্যাকশন দিতে লগইন করুন।"));
    picker.className = picker.className.includes("hide") ? "row" : "row hide";
  };
  cBtn.onclick = () => {
    open = !open; box.className = open ? "" : "hide";
    if (open) loadComments(p, box);
  };
  if (autoOpen) { open = true; box.className = ""; loadComments(p, box); }
}

function loadComments(p, box) {
  box.innerHTML = "";
  const list = el("div", {});
  box.append(list);
  async function refresh() {
    list.textContent = tx("লোড হচ্ছে...");
    try {
      const s = await getDocs(collection(db, "posts", p.id, "comments"));
      const items = s.docs.map(d => ({id: d.id, ...d.data()}))
        .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      list.innerHTML = "";
      if (!items.length) list.append(el("div", {class: "meta"}, tx("এখনো কোনো কমেন্ট নেই।")));
      items.forEach(cm => {
        const row = el("div", {class: "cm"}, el("a", {href: "#user=" + cm.uid, style: "font-weight:bold;color:inherit;text-decoration:none"}, cm.authorName || tx("অজ্ঞাত")), ": ", cm.text);
        if (user && (cm.uid === user.uid || isStaff())) {
          row.append(" ", el("a", {href: "#", onclick: async e => {
            e.preventDefault();
            if (!confirm(tx("কমেন্ট মুছবেন?"))) return;
            try { await deleteDoc(doc(db, "posts", p.id, "comments", cm.id)); refresh(); }
            catch (er) { alert(tx("সমস্যা: ") + er.message); }
          }}, tx("মুছুন")));
        }
        if (user && cm.uid !== user.uid) {
          row.append(" ", el("a", {href: "#", onclick: e => {
            e.preventDefault();
            report("comment", cm.id, p.id, cm.uid, cm.authorName, cm.text);
          }}, tx("রিপোর্ট")));
        }
        list.append(row);
      });
    } catch (e) { list.textContent = tx("সমস্যা: ") + e.message; }
  }
  if (user) {
    const inp = el("input", {type: "text", placeholder: tx("কমেন্ট লিখুন..."), maxLength: 1000});
    const send = el("button", {onclick: async () => {
      const t = inp.value.trim();
      if (!t) return;
      const why = blockReason();
      if (why) return alert(why);
      send.disabled = true;
      try {
        const cref = await addDoc(collection(db, "posts", p.id, "comments"), {
          uid: user.uid, authorName: nm(),
          text: t.slice(0, 1000), createdAt: serverTimestamp()
        });
        track("comment_created");
        if (p.uid && p.uid !== user.uid) notify({id: "comment_" + cref.id, to: p.uid, type: "comment", postId: p.id, ref: cref.id, text: t});
        inp.value = ""; await refresh();
      } catch (e) { alert(tx("সমস্যা: ") + e.message); }
      send.disabled = false;
    }}, tx("পাঠান"));
    box.append(el("div", {class: "row"}, inp, send));
  } else {
    box.append(el("div", {class: "meta"}, tx("কমেন্ট করতে লগইন করুন।")));
  }
  refresh();
}

function newPost() {
  const m = $("#main");
  const why0 = blockReason();
  if (why0) { m.append(el("div", {class: "card"}, why0)); return; }
  const ta = el("textarea", {rows: 5, placeholder: tx("আপনার লেখা...")});
  const file = el("input", {type: "file", accept: "image/*,video/*"});
  const msg = el("div", {class: "small"});
  const agree = el("input", {type: "checkbox"});
  const agreeRow = el("label", {class: "small", style: "display:flex;gap:6px;align-items:center;margin-top:8px"},
    agree, tx("আমি "), el("a", {href: location.origin + location.pathname + "#page=rules", target: "_blank"}, tx("নিয়মাবলী")), tx(" পড়েছি ও মানছি"));
  const btn = el("button", {onclick: async () => {
    const text = ta.value.trim();
    const f = file.files[0];
    if (!agree.checked) return msg.textContent = tx("পোস্ট করতে নিয়মাবলী মানতে হবে (টিক দিন)।");
    if (!text && !f) return msg.textContent = tx("কিছু লিখুন বা ফাইল দিন।");
    if (f && !CLOUD_NAME) return msg.textContent = tx("ছবি/ভিডিও আপলোড এখনো চালু হয়নি।");
    if (f) {
      const isVid = f.type.startsWith("video"), isImg = f.type.startsWith("image");
      if (!isVid && !isImg) return msg.textContent = tx("শুধু ছবি বা ভিডিও দেওয়া যাবে।");
      const lim = isVid ? MAX_VID_MB : MAX_IMG_MB;
      if (f.size > lim * 1048576) return msg.textContent = (isVid ? tx("ভিডিও সর্বোচ্চ {n}MB হতে পারবে।") : tx("ছবি সর্বোচ্চ {n}MB হতে পারবে।")).replace("{n}", lim);
    }
    btn.disabled = true; msg.textContent = tx("পোস্ট হচ্ছে...");
    try {
      await loadCfg();
      const why = blockReason();
      if (why) throw new Error(why);
      let mediaUrl = "", mediaType = "";
      if (f) {
        const type = f.type.startsWith("video") ? "video" : "image";
        const fd = new FormData(); fd.append("file", f); fd.append("upload_preset", UPLOAD_PRESET);
        const r = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/" + type + "/upload", {method: "POST", body: fd});
        const j = await r.json();
        if (!j.secure_url) throw new Error(tx("আপলোড ব্যর্থ"));
        mediaUrl = j.secure_url; mediaType = type;
      }
      const status = cfg.autoApprove ? "approved" : "pending";
      await addDoc(collection(db, "posts"), {
        uid: user.uid, authorName: nm(),
        text: text.slice(0, 5000), mediaUrl, mediaType,
        status, createdAt: serverTimestamp()
      });
      track("post_created", {status, has_media: mediaUrl ? 1 : 0});
      alert(status === "approved" ? tx("পোস্ট প্রকাশিত হয়েছে।") : tx("পোস্ট জমা হয়েছে। অনুমোদনের পর সবাই দেখতে পাবে।"));
      show(status === "approved" ? "home" : "mine");
    } catch (e) { msg.textContent = tx("সমস্যা: ") + e.message; btn.disabled = false; }
  }}, tx("পোস্ট করুন"));
  m.append(el("div", {class: "card"}, ta, file, agreeRow, el("div", {class: "row"}, btn), msg));
}

        }}, tx("ভেরিফাই করেছি, চেক করুন"))));
  }
  $("#main").append(card);
}
</script>
